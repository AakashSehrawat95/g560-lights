<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Everything is concentric on (64, 64), so the icon is symmetric left-to-right and centred. -->
  <defs>
    <radialGradient id="badge" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#30333e"/>
      <stop offset="1" stop-color="#121318"/>
    </radialGradient>
    <!-- rear light (magenta) at the top, front light (cyan) at the bottom -->
    <linearGradient id="lights" x1="0" y1="14" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="0.5" stop-color="#8f7cf0"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="face" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#454852"/>
      <stop offset="1" stop-color="#17181d"/>
    </radialGradient>
    <pattern id="fabric" x="2.5" y="2.5" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.55" fill="#000" fill-opacity="0.55"/>
    </pattern>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="disc"><circle cx="64" cy="64" r="60"/></clipPath>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#badge)"/>
  <g clip-path="url(#disc)">
    <circle cx="64" cy="64" r="47" fill="none" stroke="url(#lights)" stroke-width="13" opacity="0.55" filter="url(#bloom)"/>
  </g>
  <circle cx="64" cy="64" r="59.5" fill="none" stroke="#fff" stroke-opacity="0.10"/>

  <!-- the light ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#lights)" stroke-width="6.5"/>
  <circle cx="64" cy="64" r="42.8" fill="#0f1014"/>

  <!-- the speaker: cloth grille, dead centre -->
  <circle cx="64" cy="64" r="38.6" fill="url(#face)"/>
  <circle cx="64" cy="64" r="38.6" fill="url(#fabric)"/>
  <circle cx="64" cy="64" r="37.8" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="1.4"/>
  <path d="M43 46 A30 30 0 0 1 85 46" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="64" cy="92" r="2.6" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.2"/>
</svg>
